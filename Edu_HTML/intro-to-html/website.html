<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>

<style>
    .text {
        color: rgb(0, 0, 0);
        font-size: 36px;
        font-weight: bold;
    }

    .cart {
        background-color: rgb(255, 216, 20);
        color: black;
        border: none;
        height: 36px;
        width: 120px;
        font-size: 16px;
        border-radius: 18px;
        cursor: pointer;
        margin-right: 10px;
    }

    .cart:hover {
        background-color: rgb(167, 100, 0);
    }

    .cart:active {
        opacity: 0.7;
    }

    .buy {
        background-color: rgb(255, 164, 28);
        color: black;
        border: none;
        height: 36px;
        width: 120px;
        font-size: 16px;
        border-radius: 18px;
        cursor: pointer;
    }

    .buy:hover {
        background-color: rgb(167, 100, 0);
    }

    .buy:active {
        opacity: 0.7;
    }

    .price {
        color: rgb(0, 118, 0);
        font-size: 24px;
        font-weight: bold;
    }

    .link {
        color: rgb(0, 113, 113);
        font-size: 18px;
    }

    .link:hover {
        color: rgb(160, 88, 0);
    }
</style>

<body>
    <a href="https://amazon.com" target="_blank" class="link">
        Link to Amazon
    </a>

    <p class="text">
        Nike Black Running Shoes
    </p>
    
    <p class="price">
        $39 - in stock.
    </p>

    <p style="font-size: 24px;">
        Free delivery tommorow.
    </p>

    <button class="cart">
        Add to Cart
    </button>
    <button class = "buy">
        Buy now
    </button>

    
</body>
