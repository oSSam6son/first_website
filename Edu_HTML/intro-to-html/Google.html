<!doctype html>
<html>
  <head>
    <title>Google page</title>
    <link rel="stylesheet" href="styles/Google.css" />
    <style>
      .Google-main {
        display: inline-block;
      }

      .Google-preview {
        width: 200px;
        margin-bottom: -24px;  
      }
      
      .Serach-bar {
        text-align: left;
        margin-bottom: 25px;
        padding: 10px;
        border: none;
        border-radius: 100px;
        width: 380px;
        box-shadow: 0px 0px 15px -3px rgba(0, 0, 0, 0.3);
      }

      .Serach-bar:active {
        border: none;
      }

      .Search-button,
      .Lucky-button {
        border: none;
        padding: 10px;
        margin-right: 10px;
        margin-left: 10px;
      }

      .google-pic {
        text-align: center;
      }

      .search-lt {
        text-align: center;
      }

      .search-but-lt,
      .lucky-but-lt {
        display: inline-block;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div>
      <div class="google-pic"><img class="Google-preview" src="Google-preview.jfif" /></div>
      <div class="search-lt"><input class="Serach-bar" type="text" placeholder="Search Google or type URL"></search></search></div>
      <div style="text-align: center;">
        <div class="search-but-lt"><button class="Search-button">Google Search</button></div>
        <div class="lucky-but-lt"><button class="Lucky-button">I'm Feeling Lucky</button></div>
      </div>
    </div>
  </body>
</html>
